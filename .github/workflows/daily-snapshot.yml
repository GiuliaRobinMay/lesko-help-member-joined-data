name: daily-snapshot

on:
  schedule:
    # GitHub runs scheduled workflows on a best-effort basis - they are often
    # delayed by hours and are sometimes dropped entirely under load. A missed
    # day leaves a permanent hole in leaver detection, so there are three
    # catch-up slots; the guard below makes every slot after the first a no-op
    # once the day's snapshot exists, costing no API calls.
    - cron: "30 5 * * *"    # morning, 05:30 UTC
    - cron: "30 11 * * *"   # catch-up, 11:30 UTC
    - cron: "30 17 * * *"   # catch-up, 17:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: today
        name: Skip if today's snapshot already exists
        run: |
          if [ -f "data/snapshots/$(date -u +%Y-%m-%d).csv" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Today's snapshot is already in place - catch-up run does nothing."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - id: token
        name: Check for the Mighty API token
        if: steps.today.outputs.needed == 'true'
        env:
          MIGHTY_API_TOKEN: ${{ secrets.MIGHTY_API_TOKEN }}
        run: |
          if [ -n "$MIGHTY_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MIGHTY_API_TOKEN is not set yet, so no snapshot was taken. Add it under Settings -> Secrets and variables -> Actions."
          fi

      - name: Fetch today's member snapshot from Mighty Networks
        if: steps.today.outputs.needed == 'true' && steps.token.outputs.present == 'true'
        env:
          MIGHTY_API_TOKEN: ${{ secrets.MIGHTY_API_TOKEN }}
        run: python3 scripts/fetch_members.py

      - name: Rebuild the overview page
        if: steps.today.outputs.needed == 'true'
        run: python3 scripts/build_overview.py

      - name: Commit and push changes
        if: steps.today.outputs.needed == 'true'
        run: |
          git config user.name "lesko-cohort-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
